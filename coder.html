<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Code Studio Ultra Pro</title>
  <!-- Tailwind CSS CDN for modern, responsive UI styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons for crisp UI icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;600;700;800&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f1117;
      color: #e2e8f0;
      overflow: hidden;
      height: 100vh;
    }

    .font-code {
      font-family: 'Fira Code', monospace;
    }

    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #181b24;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Glow & Animation Utilities */
    .glow-save-btn {
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
      animation: pulse-glow 2s infinite;
    }
    .unsaved-glow {
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.6);
      animation: alert-pulse 1.5s infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 12px rgba(34, 197, 94, 0.4); }
      50% { box-shadow: 0 0 22px rgba(34, 197, 94, 0.8); }
    }
    @keyframes alert-pulse {
      0%, 100% { box-shadow: 0 0 10px rgba(234, 179, 8, 0.4); }
      50% { box-shadow: 0 0 22px rgba(234, 179, 8, 0.9); }
    }

    /* File Card Styles */
    .file-card {
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }
    .file-card:hover {
      transform: translateY(-1px);
      border-color: #3b82f6;
    }
    .file-card.active {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.12);
    }

    /* Smooth Drag Overlay */
    .drop-active {
      border: 2px dashed #3b82f6 !important;
      background: rgba(59, 130, 246, 0.08) !important;
    }

    /* Toast Notification Animation */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
    }
    .toast {
      animation: slideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body class="flex flex-col h-screen select-none">

  <!-- STUDIO HEADER TOOLBAR -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between z-20">

        <span>GAME STUDIO <span class="text-amber-300 font-black">ULTRA PRO</span></span>

          <button onclick="selectPresetColor('#ffffff')" class="h-6 rounded-md bg-white hover:scale-110 transition shadow" title="Pure White"></button>

    let currentActiveFile = null;

    // Built-in Starter Mini-Games
    const gameTemplates = {
      // 🎨 SUPER CANVAS PAINTER DELUXE
      canvas_painter: `<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #111; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #toolbar { background: #222; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center; border-bottom: 2px solid #333; }
    button, input, select { padding: 8px 12px; background: #333; color: white; border: 1px solid #555; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #444; }
    #canvas-container { flex: 1; position: relative; width: 100%; height: 100%; cursor: crosshair; }
    canvas { display: block; background: #ffffff; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span>🎨 Color:</span>
    <input type="color" id="colorPicker" value="#ff0055">
    <span>Size:</span>
    <input type="range" id="brushSize" min="2" max="60" value="12">
    <button id="rainbowBtn" onclick="toggleRainbow()">🌈 Rainbow Mode: OFF</button>
    <button onclick="setEraser()">🧹 Eraser</button>
    <button onclick="clearCanvas()" style="background:#d32f2f;">💥 Clear All</button>
  </div>
  <div id="canvas-container">
    <canvas id="paintCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let isRainbow = false;
    let isEraser = false;
    let hue = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - document.getElementById('toolbar').offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function startDraw(e) {
      drawing = true;
      draw(e);
    }
    function stopDraw() {
      drawing = false;
      ctx.beginPath();
    }
    function draw(e) {
      if(!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

      ctx.lineWidth = document.getElementById('brushSize').value;
      ctx.lineCap = 'round';

      if(isEraser) {
        ctx.strokeStyle = '#ffffff';
      } else if(isRainbow) {
        ctx.strokeStyle = 'hsl(' + hue + ', 100%, 50%)';
        hue = (hue + 4) % 360;
      } else {
        ctx.strokeStyle = document.getElementById('colorPicker').value;
      }

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    function toggleRainbow() {
      isRainbow = !isRainbow;
      isEraser = false;
      document.getElementById('rainbowBtn').innerText = isRainbow ? "🌈 Rainbow Mode: ON" : "🌈 Rainbow Mode: OFF";
    }
    function setEraser() {
      isEraser = true;
      isRainbow = false;
      document.getElementById('rainbowBtn').innerText = "🌈 Rainbow Mode: OFF";
    }
    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchend', stopDraw);
    canvas.addEventListener('touchmove', draw);
  <\/script>
</body>
</html>`,

      // 🚀 SPACE DEFENDER ARCADE
      space_defender: `<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin:0; background:#000; color:#fff; font-family:sans-serif; text-align:center; overflow:hidden; }
    canvas { background:#050515; display:block; margin:0 auto; }
    #ui { position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:18px; font-weight:bold; }
  </style>
</head>
<body>
  <div id="ui">🚀 Score: <span id="s">0</span></div>
  <canvas id="c"></canvas>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let score = 0;
    let player = { x: canvas.width/2, y: canvas.height - 60, w: 40, h: 40 };
    let bullets = [];
    let enemies = [];

    function spawnEnemy() {
      enemies.push({ x: Math.random() * (canvas.width - 30), y: -30, speed: 2 + Math.random()*3 });
    }
    setInterval(spawnEnemy, 800);

    window.onmousemove = (e) => { player.x = e.clientX - player.w/2; };
    window.onclick = () => { bullets.push({ x: player.x + player.w/2 - 3, y: player.y, w: 6, h: 15 }); };

    function loop() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      
      // Draw Player Ship
      ctx.fillStyle = '#00f0ff';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      // Bullets
      ctx.fillStyle = '#ff0055';
      bullets.forEach((b, i) => {
        b.y -= 8;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        if(b.y < 0) bullets.splice(i, 1);
      });

      // Enemies
      ctx.fillStyle = '#ffb703';
      enemies.forEach((e, ei) => {
        e.y += e.speed;
        ctx.fillRect(e.x, e.y, 30, 30);

        // Check collision with bullets
        bullets.forEach((b, bi) => {
          if(b.x < e.x + 30 && b.x + b.w > e.x && b.y < e.y + 30 && b.y + b.h > e.y) {
            enemies.splice(ei, 1);
            bullets.splice(bi, 1);
            score += 10;
            document.getElementById('s').innerText = score;
          }
        });
      });

      requestAnimationFrame(loop);
    }
    loop();
  <\/script>
</body>
</html>`,

    let x = canvas.width/2, y = canvas.height-30, dx = 2, dy = -2, ballRadius = 8;
    let paddleWidth = 75, paddleX = (canvas.width-paddleWidth)/2;
    
    document.addEventListener("mousemove", (e) => {
      let relativeX = e.clientX - canvas.offsetLeft;
      if(relativeX > 0 && relativeX < canvas.width) paddleX = relativeX - paddleWidth/2;
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00f0ff";
      ctx.beginPath(); ctx.arc(x, y, ballRadius, 0, Math.PI*2); ctx.fill();
      
      ctx.fillStyle = "#ff0055";
      ctx.fillRect(paddleX, canvas.height-12, paddleWidth, 10);

      if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) dx = -dx;
      if(y + dy < ballRadius) dy = -dy;
      else if(y + dy > canvas.height-ballRadius) {
        if(x > paddleX && x < paddleX + paddleWidth) dy = -dy;
        else { x = canvas.width/2; y = canvas.height-30; dy = -2; }
      }

      x += dx; y += dy;
      requestAnimationFrame(draw);

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);

        e.preventDefault();
        overlay.classList.remove('hidden');

      dropZone.ondragleave = (e) => {
        if (e.relatedTarget && dropZone.contains(e.relatedTarget)) return;
        overlay.classList.add('hidden');

        e.preventDefault();
        overlay.classList.add('hidden');

      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentActiveFile || 'game'}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Exported ${currentActiveFile}.html!`, 'success');

      const toast = document.createElement('div');

      let icon = 'fa-info-circle text-blue-400';

      if (type === 'success') {

      } else if (type === 'error') {
        bg = 'bg-rose-950/90 border-rose-800 text-rose-200';
        icon = 'fa-triangle-exclamation text-rose-400';
      }

      toast.className = `toast ${bg} border p-3 rounded-lg shadow-xl text-xs flex items-center gap-2.5 mb-2 font-medium backdrop-blur-sm`;
      toast.innerHTML = `<i class="fa-solid ${icon} text-sm"></i> <span>${message}</span>`;

      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }
